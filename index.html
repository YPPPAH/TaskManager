<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organization</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sidebar">
        <div class="sidebar-content">
            <h2>Settings</h2>
            <button class="menu-btn" onclick="toggleTaskActions()">Toggle Edit Mode</button>
        </div>
        <button id="sidebarToggle" onclick="toggleSidebar()"><img id="toggleIcon" src="arrow_left.svg" alt="toggle" width="25" height="25"></button>
    </div>
    <div id="calendar"></div>
    <div class="modal-overlay" id="taskModal">
        <div class="modal">
            <h3>New Task</h3>
            <input type="text" id="taskTitle" placeholder="What needs to be done?">
            <label style="color: var(--text-muted); font-size: 0.85rem; display: block; margin-bottom: 5px;">Optional Deadline:</label>
            <input type="date" id="taskDeadline">
            <select id="taskCategory">
                <option value="default">Default (Grey)</option>
                <option value="task">Assignment (Pink)</option>
                <option value="task_deadline">Task Deadline (Purple)</option>
                <option value="study">Study (Blue)</option>
                <option value="exam">Exam (Red)</option>
                <option value="game">Game (Orange)</option>
            </select>
            <button onclick="saveTask()">Add Task</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
